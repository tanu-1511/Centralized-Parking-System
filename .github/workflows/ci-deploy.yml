name: CI, Security Checks and Deploy

on:
  push:
    branches:
      - main
      - feature/takeover
  pull_request:
    branches:
      - main

jobs:
  security-checks:
    name: Security and Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # ruff 0.16 widened the default rule set (~10x findings); pin until an explicit config exists
          pip install pip-audit "ruff<0.16"

      - name: Audit dependencies
        run: pip-audit -r requirements.txt || true

      - name: Run Ruff
        shell: bash
        run: |
          set +e
          ruff check . --output-format=json > ruff-results.json
          ruff_exit=$?
          set -e

          cat ruff-results.json

          error_count=$(python -c "import json; print(len(json.load(open('ruff-results.json'))))")

          echo "Ruff findings: $error_count"

          if [ "$error_count" -gt 100 ]; then
            echo "Ruff threshold exceeded: $error_count findings (maximum allowed: 100)"
            exit 1
          fi

          echo "Ruff threshold passed: $error_count findings (maximum allowed: 100)"

  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-camera.txt

      - name: Run pytest
        run: pytest -v

  deploy:
    name: Deploy to Vercel
    needs: [security-checks, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --yes --token "$VERCEL_TOKEN"
