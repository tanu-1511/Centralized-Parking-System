{% extends "base.html" %}
{% block title %}Edit vehicle{% endblock %}
{% block content %}
<div class="narrow" style="margin-left:0">
    <h1>Edit vehicle</h1>

    <form method="POST" action="{{ url_for('vehicles.update_vehicle', vehicle_id=vehicle.vehicle_id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="field">
            <label for="vehicle_number">Vehicle number</label>
            <input type="text" id="vehicle_number" name="vehicle_number" value="{{ vehicle.vehicle_number }}" maxlength="20" required>
        </div>
        <div class="field">
            <label for="vehicle_type">Type</label>
            <select id="vehicle_type" name="vehicle_type">
                {% for t in vehicle_types %}
                <option value="{{ t }}" {% if t == vehicle.vehicle_type %}selected{% endif %}>{{ t }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="field">
            <label for="vehicle_model">Model (optional)</label>
            <input type="text" id="vehicle_model" name="vehicle_model" value="{{ vehicle.vehicle_model or '' }}" maxlength="50">
        </div>
        <button type="submit">Save vehicle</button>
    </form>

    <p><a href="{{ url_for('vehicles.list_vehicles') }}">Back to my vehicles</a></p>
</div>
{% endblock %}
