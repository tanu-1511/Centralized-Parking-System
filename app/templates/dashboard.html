<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Centralized Parking Management</title>
</head>

<body>

    <h1>Dashboard</h1>

    <p>Signed in as <strong>{{ user.username }}</strong> ({{ user.role }}).</p>

    <p><a href="{{ url_for('vehicles.list_vehicles') }}">My vehicles</a></p>
    <p><a href="{{ url_for('reservations.new_reservation') }}">Book a slot</a> &middot; <a href="{{ url_for('reservations.my_reservations') }}">My reservations</a></p>
    <p><a href="{{ url_for('facilities.list_facilities') }}">Parking facilities</a></p>

    {% if user.role == 'admin' %}
    <p><a href="{{ url_for('facilities.manage_users') }}">Manage user roles</a></p>
    {% endif %}

    <p>Your vehicles and reservations will appear here in later steps.</p>

    <form method="POST" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit">Logout</button>
    </form>

</body>
</html>
