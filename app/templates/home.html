{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<h1>Centralized Parking Management</h1>
<p class="muted">Find, reserve, and manage parking from one platform.</p>

{% if user %}
<p>Signed in as <strong>{{ user.username }}</strong>.</p>
<p><a class="btn" href="{{ url_for('main.dashboard') }}">Go to dashboard</a></p>
{% else %}
<p>
    <a class="btn" href="{{ url_for('auth.login') }}">Login</a>
    <a class="btn outline" href="{{ url_for('auth.signup') }}">Sign up</a>
</p>
{% endif %}
{% endblock %}
